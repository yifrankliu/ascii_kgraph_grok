<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kgraph</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        min-height: 100vh;
        background: #000;
        color: #e8e4dc;
      }
      body {
        display: grid;
        grid-template-rows: auto 1fr auto;
        grid-template-columns: minmax(0, 1fr);
        font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      }
      body.dragging #stage {
        outline: 1px solid #7eb8c9;
        outline-offset: -8px;
      }
      header {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: baseline;
        padding: 0.85rem 1rem 0.25rem;
        text-align: center;
      }
      header h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.22em;
        text-transform: lowercase;
        color: #f7f3ea;
      }
      #friends-toggle {
        justify-self: start;
        font: inherit;
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.22em;
        text-transform: lowercase;
        color: #f7f3ea;
        background: transparent;
        border: 0;
        padding: 0;
        cursor: pointer;
        white-space: nowrap;
      }
      #friends-toggle[aria-expanded="true"],
      #friends-toggle:hover {
        color: #d7f3f8;
      }
      #friends-toggle:focus-visible {
        outline: 1px solid #7eb8c9;
        outline-offset: 3px;
      }
      .header-pad {
        justify-self: end;
      }
      #stage {
        width: 100%;
        height: 100%;
        margin: 0;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        box-sizing: border-box;
      }
      footer {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.35rem;
        padding: 0.65rem 1rem 1rem;
        border-top: 1px solid #2a2621;
      }
      footer button {
        font: inherit;
        color: #d7f3f8;
        background: transparent;
        border: 0;
        padding: 0;
        cursor: pointer;
        text-decoration: underline;
        text-underline-offset: 3px;
        font-size: 12px;
      }
      #status {
        margin: 0;
        color: #9a948a;
        font-size: 12px;
        text-align: center;
      }
      #panel {
        position: fixed;
        top: 2.15rem;
        right: 0;
        bottom: 5.1rem;
        width: min(28rem, 100%);
        height: auto;
        box-sizing: border-box;
        padding: 1rem 1.15rem 1.4rem;
        overflow: auto;
        background: #000;
        border-left: 2px solid #fff;
        color: #e8e4dc;
        font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
        font-size: 13px;
        line-height: 1.45;
      }
      #panel[hidden] {
        display: none;
      }
      #friends-panel {
        position: fixed;
        z-index: 3;
        top: 2.15rem;
        left: 0;
        bottom: 5.1rem;
        width: min(28rem, 100%);
        box-sizing: border-box;
        padding: 1rem 1.15rem 1.4rem;
        overflow: auto;
        overscroll-behavior: contain;
        background: #000;
        border-right: 2px solid #fff;
        color: #e8e4dc;
        font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
        font-size: 13px;
        line-height: 1.45;
      }
      #friends-panel[hidden] {
        display: none;
      }
      #friends-find {
        display: block;
        width: 100%;
        box-sizing: border-box;
        margin: 0.85rem 0 0;
        padding: 0.35rem 0;
        font: inherit;
        font-size: 13px;
        color: #f7f3ea;
        background: transparent;
        border: 0;
        border-bottom: 2px solid #fff;
        border-radius: 0;
        outline: none;
      }
      #friends-find::placeholder {
        color: #9a948a;
      }
      #friends-find:focus-visible,
      #friends-toggle:focus-visible,
      #friends-panel button:focus-visible {
        outline: 1px solid #7eb8c9;
        outline-offset: 3px;
      }
      #friends-panel .reply-title[aria-pressed="true"] {
        color: #7eb8c9;
      }
      #panel h2,
      #friends-panel h2 {
        margin: 0.2rem 0 0;
        font-family: inherit;
        font-size: 15px;
        font-weight: 500;
        letter-spacing: 0.04em;
        color: #f7f3ea;
      }
      #panel p,
      #friends-panel p {
        margin: 0;
      }
      #panel .kind,
      #friends-panel .kind {
        color: #7eb8c9;
        font-size: 11px;
        letter-spacing: 0.18em;
      }
      #panel .path,
      #friends-panel .path {
        margin-top: 0.28rem;
        color: #9a948a;
        font-size: 11px;
      }
      #panel .plate,
      #friends-panel .plate {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 0.75rem;
        margin: 0 -1.15rem;
        padding: 0 1.15rem 0.75rem;
        border-bottom: 2px solid #fff;
      }
      #panel .plate-main,
      #friends-panel .plate-main {
        min-width: 0;
      }
      #panel .post,
      #friends-panel .post {
        padding-top: 0.8rem;
      }
      #panel .tag,
      #friends-panel .tag {
        margin-bottom: 0.4rem;
        color: #fff;
        font-size: 11px;
        letter-spacing: 0.2em;
      }
      #panel .body,
      #friends-panel .body {
        color: #f7f3ea;
      }
      #panel .thread,
      #friends-panel .thread {
        margin: 0.85rem -1.15rem 0;
        padding: 0.75rem 1.15rem 0;
        border-top: 2px solid #fff;
      }
      #panel .replies,
      #friends-panel .replies {
        margin: 0.2rem 0 0 0.15rem;
        padding-left: 0.9rem;
      }
      #panel .reply,
      #friends-panel .reply {
        position: relative;
        padding: 0.32rem 0 0.32rem 0.15rem;
      }
      #panel .reply::before,
      #panel .reply::after,
      #friends-panel .reply::before,
      #friends-panel .reply::after {
        content: "";
        position: absolute;
        background: #fff;
      }
      #panel .reply::before,
      #friends-panel .reply::before {
        left: -0.9rem;
        top: 0;
        bottom: 0;
        width: 1px;
      }
      #panel .reply::after,
      #friends-panel .reply::after {
        left: -0.9rem;
        top: 0.78rem;
        width: 0.72rem;
        height: 1px;
      }
      #panel .reply:last-child::before,
      #friends-panel .reply:last-child::before {
        bottom: auto;
        height: 0.78rem;
      }
      #panel .reply-title,
      #panel .reply-label,
      #friends-panel .reply-title,
      #friends-panel .reply-label {
        color: #fff;
        font-size: 13px;
      }
      #panel .reply-title,
      #friends-panel .reply-title {
        font: inherit;
        display: block;
        padding: 0;
        border: 0;
        background: transparent;
        cursor: pointer;
        text-align: left;
      }
      #panel .reply-title:hover,
      #friends-panel .reply-title:hover {
        color: #7eb8c9;
      }
      #panel .reply-note,
      #friends-panel .reply-note {
        margin-top: 0.2rem;
        color: #c8c2b8;
      }
      #close,
      #friends-close {
        flex: 0 0 auto;
        font: inherit;
        font-size: 11px;
        letter-spacing: 0.16em;
        color: #fff;
        background: transparent;
        border: 1px solid #fff;
        padding: 0.28rem 0.5rem;
        cursor: pointer;
      }
      #close:hover,
      #friends-close:hover {
        background: #fff;
        color: #000;
      }
    </style>
  </head>
  <body>
    <header>
      <button id="friends-toggle" type="button" aria-expanded="false" aria-controls="friends-panel">
        friends
      </button>
      <h1>kgraph</h1>
      <span class="header-pad" aria-hidden="true"></span>
    </header>
    <aside id="friends-panel" hidden aria-labelledby="friends-title">
      <div class="plate">
        <div class="plate-main">
          <p class="kind">index</p>
          <h2 id="friends-title">friends</h2>
          <p id="friends-count" class="path"></p>
        </div>
        <button id="friends-close" type="button">close</button>
      </div>
      <input
        id="friends-find"
        type="text"
        placeholder="index notes, concepts, people"
        aria-label="Index friends' graphs"
        autocomplete="off"
        spellcheck="false"
      />
      <div id="friends-index"></div>
      <div id="friends-threads"></div>
    </aside>
    <pre id="stage"></pre>
    <footer>
      <button id="reroot" type="button">set different root directory</button>
      <p id="status"></p>
    </footer>
    <aside id="panel" hidden>
      <button id="close" type="button">close</button>
    </aside>
    <input id="picker" type="file" webkitdirectory directory multiple hidden />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
