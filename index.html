<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kgraph</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #141210;
        color: #e8e4dc;
      }
      body {
        display: grid;
        grid-template-rows: auto 1fr auto;
        font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      }
      body.dragging #stage {
        outline: 1px solid #7eb8c9;
        outline-offset: -8px;
      }
      header {
        padding: 0.85rem 1rem 0.25rem;
        text-align: center;
      }
      header h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.22em;
        text-transform: lowercase;
        color: #f7f3ea;
      }
      #stage {
        height: 100%;
        margin: 0;
        min-height: 0;
        overflow: hidden;
      }
      footer {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.35rem;
        padding: 0.65rem 1rem 1rem;
        border-top: 1px solid #2a2621;
      }
      footer button {
        font: inherit;
        color: #d7f3f8;
        background: transparent;
        border: 0;
        padding: 0;
        cursor: pointer;
        text-decoration: underline;
        text-underline-offset: 3px;
        font-size: 12px;
      }
      #status {
        margin: 0;
        color: #9a948a;
        font-size: 12px;
        text-align: center;
      }
      #panel {
        position: fixed;
        top: 0;
        right: 0;
        width: min(22rem, 100%);
        height: 100%;
        box-sizing: border-box;
        padding: 1.2rem 1.3rem;
        overflow: auto;
        background: #1c1916;
        border-left: 1px solid #3a342c;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      #panel[hidden] {
        display: none;
      }
      #panel h2 {
        margin: 0.4rem 0;
        font-family: "Iowan Old Style", Palatino, Georgia, serif;
        font-size: 1.35rem;
        font-weight: 500;
      }
      #panel .kind {
        color: #7eb8c9;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      #panel li {
        margin: 0.2rem 0;
      }
      #panel p {
        margin: 0.35rem 0;
      }
      #close {
        float: right;
        font: inherit;
        color: #d7f3f8;
        background: transparent;
        border: 0;
        padding: 0;
        cursor: pointer;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>kgraph</h1>
    </header>
    <pre id="stage"></pre>
    <footer>
      <button id="reroot" type="button">set different root directory</button>
      <p id="status"></p>
    </footer>
    <aside id="panel" hidden>
      <button id="close" type="button">Close</button>
    </aside>
    <input id="picker" type="file" webkitdirectory directory multiple hidden />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
